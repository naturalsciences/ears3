spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: ""
    password: ""
    test-on-borrow: true
    validationQuery: SELECT 1

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        strategy: org.hibernate.cfg.EJB3NamingStrategy
    defer-datasource-initialization: true

  mvc:
    static-path-pattern: /resources/**

  h2:
    console:
      enabled: true

logging:
  level:
    org:
      springframework:
        web: DEBUG
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE
java:
  util:
    logging:
      SimpleFormatter:
        format: "%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS %4$-6s %2$s %5$s%6$s%n"

server:
  port: 8081
  servlet:
    context-path: /ears3


ears:
  platform: SDN:C17::11BU
  send-events-to: http://sjdhgkljdfd.com
  navigation:
    server: http://sjdhgkljdfd.com
  csr:
    license: UN
  ontology:
    username: earsontology
    password: REPLACEME
    # Gates tree edits. Master only.
    editing-enabled: ${EARS_ONTOLOGY_EDITING_ENABLED:true}
    # Gates stage RDF from database, ingest from rdf file to database
    import-enabled: ${EARS_ONTOLOGY_IMPORT_ENABLED:true}
    rdf:
      # The location of the staged RDF file. Staged is either generated from file or from the db.
      # Live is in the db, and a live rdf is generated in real-time from the database.
      staged-path: ${EARS_ONTOLOGY_RDF_STAGED_PATH:/var/ears/ontology/earsv2-onto-vessel.rdf}
      # Timestamped backup of outgoing live file on each activate(), for
      # manual rollback. No UI yet at POC stage.
      archive-dir: ${EARS_ONTOLOGY_RDF_ARCHIVE_DIR:/var/ears/ontology/archive}
  read-only: false
  program:
    regex: "202[6-9]"