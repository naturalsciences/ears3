<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/f}">

<head th:replace="fragments/f :: head"></head>

<body>
<nav th:replace="fragments/f :: header"></nav>
<div class="container" layout:fragment="main">
    <h1 id="h1">Events</h1>
    <div id="search" class="mb-3 p-3 border rounded">
        <h4>Filter Events
            <a th:href="@{/api/events.csv}"
               id="csvDownloadLink"
               class="btn btn-secondary btn-sm"
               title="Download Filtered CSV">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-box-arrow-down"
                     viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                          d="M3.5 10a.5.5 0 0 1-.5-.5v-8a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 0 0 1h2A1.5 1.5 0 0 0 14 9.5v-8A1.5 1.5 0 0 0 12.5 0h-9A1.5 1.5 0 0 0 2 1.5v8A1.5 1.5 0 0 0 3.5 11h2a.5.5 0 0 0 0-1z"/>
                    <path fill-rule="evenodd"
                          d="M7.646 15.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 14.293V5.5a.5.5 0 0 0-1 0v8.793l-2.146-2.147a.5.5 0 0 0-.708.708z"/>
                </svg>
            </a>
            <button type="button" id="btnClearSearch"
                    class="btn btn-secondary btn-sm"
                    title="Clear all filters">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-funnel-fill"
                     viewBox="0 0 16 16">
                    <path d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5z"/>
                    <line id="filterStrike" x1="1" y1="15" x2="15" y2="1" stroke="red" stroke-width="1.5"
                          stroke-linecap="round" style="display:none;"/>
                </svg>
            </button>
        </h4>
        <div class="form-inline mb-2">
            <div class="form-group mr-3 mb-2">
                <select name="cruise" id="cruiseField"
                        class="selectpicker target form-control"
                        data-live-search="true" title="Filter cruise">
                    <option value="reset">Any cruise</option>
                </select>
            </div>
            <div class="form-group mr-3 mb-2">
                <select name="program" id="programField"
                        class="selectpicker target form-control"
                        data-live-search="true" title="Filter program">
                    <option value="">Any program</option>
                </select>
            </div>
            <div class="form-group mr-3 mb-2">
                <p>
                    <input name="station" id="stationField" type="text" placeholder="" title="Filter station"
                           class="form-control"/>
                    <label for="stationField" class="txtBox">Filter station</label>
                </p>
            </div>
            <div class="form-group mr-3 mb-2">
                <p>
                    <input name="search" id="freeTextField" type="text" placeholder=""
                           title="Search label, description"
                           class="form-control"
                    />
                    <label for="freeTextField" class="txtBox">Search label, description</label>
                </p>
            </div>
        </div>
        <div class="form-inline mb-2">
            <div class="form-check mr-3 mb-2">
                <input name="cbOwnEvents" id="cbOwnEvents" class="form-check-input" type="checkbox" checked>
                <label for="cbOwnEvents" class="form-check-label">My own events only</label>
            </div>
            <div class="form-group mr-3 mb-2">
                <p>
                    <input id="startDateField" class="form-control" type="date"/>
                    <input id="startTimeField" class="form-control" type="time" value="08:00"/>
                    <label for="startDateField" class="txtBox">From (UTC)</label>
                </p>
            </div>
            <div class="form-group mr-3 mb-2">
                <p>
                    <input id="endDateField" class="form-control" type="date"/>
                    <input id="endTimeField" class="form-control" type="time" value="18:00"/>
                    <label for="endDateField" class="txtBox">To (UTC)</label>
                </p>
            </div>

        </div>
    </div>
    <div id="toggle" class="mb-3 p-3 border rounded">
        <h4>Toggle columns</h4>
        <ul>
            <li><a href="#" class="toggle-vis" data-column="3">Cruise</a></li>
            <li><a href="#" class="toggle-vis" data-column="4">Program</a></li>
            <li><a href="#" class="toggle-vis" data-column="5">Category</a></li>
            <li><a href="#" class="toggle-vis" data-column="9">Station</a></li>
            <li><a href="#" class="toggle-vis" data-column="10">Label</a></li>
            <li><a href="#" class="toggle-vis" data-column="11">Note</a></li>
            <li><a href="#" class="toggle-vis" data-column="12">Actor</a></li>
        </ul>
    </div>
    <table id="eventTable" class="display dataTable" style="width:100%" role="grid">
        <thead>
        <tr>
            <th>identifier</th>
            <th>Date</th>
            <th>Time</th>
            <th>Cruise</th>
            <th>Program</th>
            <th>Category</th>
            <th>Tool</th>
            <th>Process</th>
            <th>Action</th>
            <th>Station</th>
            <th>Label</th>
            <th>Note</th>
            <th>Actor</th>
        </tr>
        </thead>
    </table>

    <script src="/ears3/js/ears-events-api.js" type="application/javascript"></script>
    <script src="/ears3/js/jquery.dataTables.min.js" type="application/javascript"></script>

    <script type="application/javascript" th:inline="none">

        let table;
        let lastDraw = 0;

        // Maps DataTables column index -> backend-sortable property name.
        // null = column isn't sortable server-side (adjust to match your entity's actual property paths).
        const sortableColumns = [
            'identifier',               // 0
            'timeStamp',                // 1 (date)
            'timeStamp',                // 2 (time)
            'cruise.identifier',                   // 3
            'program.identifier',                  // 4
            'toolCategory.name',        // 5
            'tool.term.name',           // 6
            'process.name',             // 7
            'action.name',              // 8
            'station',                  // 9
            'label',                    // 10
            'description',              // 11
            'actor.lastName',              // 12
        ];

        function updateCsvLink() {
            const base = document.getElementById('csvDownloadLink').getAttribute('data-base')
                || document.getElementById('csvDownloadLink').href;
            const params = collectSearchParams(); // page/size/sort aren't relevant for a full CSV export
            const query = new URLSearchParams(params).toString();
            document.getElementById('csvDownloadLink').href = query ? base.split('?')[0] + '?' + query : base.split('?')[0];
        }

        function hasActiveFilters() {
            return !!(
                document.getElementById('cruiseField').value ||
                document.getElementById('programField').value ||
                document.getElementById('stationField').value.trim() ||
                document.getElementById('freeTextField').value.trim() ||
                document.getElementById('cbOwnEvents').checked ||
                document.getElementById('startDateField').value ||
                document.getElementById('endDateField').value
            );
        }

        function updateFilterIcon() {
            document.getElementById('filterStrike').style.display = hasActiveFilters() ? '' : 'none';
        }

        // Single source of truth for every filter the API supports.
        // API supports: (platformIdentifier->not included as the boat is fixed) cruiseIdentifier programIdentifier actorEmail startDate endDate search
        // Add a new filter here and it's automatically included in every ajax call.
        function collectSearchParams() {
            const params = {};

            const program = document.getElementById('programField').value;
            if (program) {
                params.programIdentifier = program;
            }

            const station = document.getElementById('stationField').value.trim();
            if (station) {
                params.station = station;
            }

            const freeText = document.getElementById('freeTextField').value.trim();
            if (freeText) {
                params.search = freeText;
            }

            if (document.getElementById('cbOwnEvents').checked) {
                const actor = JSON.parse(localStorage.actor);
                params.actorEmail = actor.email;
            }

            const startDate = document.getElementById('startDateField').value;
            if (startDate) {
                params.startDate = startDate + "T" + document.getElementById('startTimeField').value + "Z";
            }

            const endDate = document.getElementById('endDateField').value;
            if (endDate) {
                params.endDate = endDate + "T" + document.getElementById('endTimeField').value + "Z";
            }
            return params;
        }

        $(document).ready(function () {
            let searchDebounce;
            $('#search').on('change', 'select, input[type=checkbox], input[type=date], input[type=time]', function () { //program, checkbox and datetime
                table.ajax.reload();
                updateCsvLink();
                updateFilterIcon();
            });
            $('#search').on('change', 'input[type=text]', function () { //station text box and free text search box
                clearTimeout(searchDebounce);
                searchDebounce = setTimeout(function () {
                    table.ajax.reload();
                    updateCsvLink();
                    updateFilterIcon();
                }, 400);
            });

            $('#cruiseField').on('change', function () {
                const cruiseIdentifier = this.value;
                if (cruiseIdentifier === 'reset') {
                    document.getElementById('startDateField').value = '';
                    document.getElementById('startTimeField').value = '08:00';
                    document.getElementById('endDateField').value = '';
                    document.getElementById('endTimeField').value = '18:00';
                } else {
                    const cruise = cruiseLookup[cruiseIdentifier];
                    if (cruise) {
                        const [startDate, startTime] = cruise.startDate.replace('Z', '').split('T');
                        const [endDate, endTime] = cruise.endDate.replace('Z', '').split('T');
                        document.getElementById('startDateField').value = startDate;
                        document.getElementById('startTimeField').value = startTime.slice(0, 5);
                        document.getElementById('endDateField').value = endDate;
                        document.getElementById('endTimeField').value = endTime.slice(0, 5);
                    }
                }
                updateCsvLink();
                updateFilterIcon();
            });

            $('#btnClearSearch').on('click', function () {
                $('#cruiseField').selectpicker('val', '');
                $('#programField').selectpicker('val', '');
                document.getElementById('stationField').value = '';
                document.getElementById('freeTextField').value = '';
                document.getElementById('cbOwnEvents').checked = false;
                document.getElementById('startDateField').value = '';
                document.getElementById('startTimeField').value = '08:00';
                document.getElementById('endDateField').value = '';
                document.getElementById('endTimeField').value = '18:00';
                table.ajax.reload();
                updateCsvLink();
                updateFilterIcon();
            });

            table = $('#eventTable').DataTable({
                responsive: false,
                autoWidth: false,
                serverSide: true,
                processing: true,
                searching: false,
                ajax: {
                    url: eventsGetLocation,
                    headers: {'Accept': 'application/json;'},
                    data: function (json) {
                        lastDraw = json.draw;

                        const params = {
                            page: Math.floor(json.start / json.length),
                            size: json.length
                        };

                        if (json.order && json.order.length) {
                            const col = sortableColumns[json.order[0].column];
                            if (col) {
                                params.sort = col + ',' + json.order[0].dir;
                            }
                        }

                        Object.assign(params, collectSearchParams());

                        return params;
                    },
                    dataSrc: function (json) {
                        json.draw = lastDraw;
                        json.recordsTotal = json.totalElements;
                        json.recordsFiltered = json.totalElements;

                        return (json.content || []).map(function (event) {
                            const date = event.timeStamp.split("T")[0].split("-").reverse().join("/").replace(/\/20/, "/'");
                            const time = event.timeStamp.split("T")[1].replace(/\+\d{2}:\d{2}$/, "");
                            return {
                                'identifier': event.identifier,
                                'date': date,
                                'time': time,
                                'cruise': event.cruise?.identifier ?? null,
                                'program': event.program?.identifier ?? null,
                                'toolCategory': event.toolCategory.name,
                                'tool': event.tool.term.name,
                                'process': event.process.name,
                                'action': event.action.name,
                                'station': event.station,
                                'label': event.label,
                                'description': event.description,
                                'actor': (event.actor.firstName + " " + event.actor.lastName).trim()
                            };
                        });
                    }
                },
                "columns": [
                    {'data': 'identifier'},
                    {'data': 'date'},
                    {'data': 'time'},
                    {'data': 'cruise'},
                    {'data': 'program'},
                    {'data': 'toolCategory'},
                    {'data': 'tool'},
                    {'data': 'process'},
                    {'data': 'action'},
                    {'data': 'station'},
                    {'data': 'label'},
                    {'data': 'description'},
                    {'data': 'actor'},
                ],
                "order": [[1, 'desc'], [2, 'desc']],
                "columnDefs": [
                    {"targets": [0], "visible": false, "searchable": false},
                    {"targets": [1], "visible": true, "searchable": false, width: '60px'},
                    {"targets": [2], "visible": true, "searchable": false, width: '60px'},
                    {"targets": [3], "visible": true, "searchable": false, width: '80px'},
                    {"targets": [4], "visible": true, "searchable": false, width: '80px'},
                    {"targets": [5], "visible": true, "searchable": false, width: '80px'},
                    {"targets": [6], "visible": true, "searchable": false, width: '140px'},
                    {"targets": [7], "visible": true, "searchable": false, width: '80px'},
                    {"targets": [8], "visible": true, "searchable": false, width: '80px'},
                    {"targets": [9], "visible": true, "searchable": false, width: '40px'},
                    {"targets": [10], "visible": true, "searchable": false, width: '40px'},
                    {"targets": [11], "visible": true, "searchable": false, width: '40px'},
                    {"targets": [12], "visible": true, "searchable": false, width: '40px'},
                ],
                "lengthMenu": [[50, 100, 200, 300], [50, 100, 200, 300]]
            });
            updateCsvLink();
            updateFilterIcon();
        });

        $('#eventTable').on('click', 'tbody td:not(:has(svg.deleteEvent))', function () {
            const identifier = table.row(this).data().identifier;
            window.location.href = './event/' + identifier + '/edit';
        });

        $('#eventTable').on('click', 'tbody td:has(svg.deleteEvent)', function () {
            const row = table.row($(this).parents('tr'));
            const data = row.data();
            const identifier = data.identifier;

            const actorName = data.actor;
            const actor = JSON.parse(localStorage.actor);
            if (actorName === (actor.firstName + " " + actor.lastName).trim()) {
                if (confirm(actorName + ', are you sure you want to delete this event "' + data.tool + '-' + data.process + '-' + data.action + ' at ' + data.date + '/' + data.time + '"?')) {
                    deleteEvent(identifier);
                    table.ajax.reload();
                }
            } else {
                alert("You can only delete your own events. The owner is " + actorName + ". Please don't mess with other persons' events.");
            }
        });

        $('a.toggle-vis').css("font-weight", "bold");
        $('a.toggle-vis').on('click', function (e) {
            e.preventDefault();
            const column = table.column($(this).attr('data-column'));
            column.visible(!column.visible());
            if (column.visible()) {
                $(this).css("font-weight", "bold");
            } else {
                $(this).css("font-weight", "normal");
            }
        });

    </script>
</div>
</body>
</html>
