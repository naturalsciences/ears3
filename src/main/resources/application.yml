spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6543/ears3
    username: ears
    password: ears
    test-on-borrow: true
    validationQuery: SELECT 1

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
      naming:
        strategy: org.hibernate.cfg.EJB3NamingStrategy
    defer-datasource-initialization: true

  mvc:
    static-path-pattern: /resources/**

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

logging:
  level:
    org:
      springframework:
        web: DEBUG

java:
  util:
    logging:
      SimpleFormatter:
        format: "%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS %4$-6s %2$s %5$s%6$s%n"

server:
  port: 8081
  servlet:
    context-path: /ears3
app:
  security:
    users:
      - username: admin
        password: REPLACEME
        roles:
          - ADMIN
      - username: admin-tree
        password: REPLACEME
        roles:
          - ADMIN_TREE
      - username: admin-event
        password: REPLACEME
        roles:
          - ADMIN_EVENT
  platform: SDN:C17::11BU
  send-events-to: http://replace.me
  navigation:
    server: http://replace.me
  csr:
    license: UN
  ontology:
    # Gates tree edits. Master only. This overrides the rights of an admin.
    editing-enabled: ${EARS_ONTOLOGY_EDITING_ENABLED:true}
    # Gates stage RDF from database, ingest from rdf file to database
    import-enabled: ${EARS_ONTOLOGY_IMPORT_ENABLED:true}
    rdf:
      # The location of the staged RDF file. Staged is either generated from file or from the db.
      # Live is in the db, and a live rdf is generated in real-time from the database.
      staged-path: ${EARS_ONTOLOGY_RDF_STAGED_PATH:/var/ears/ontology/earsv2-onto-vessel.rdf}
      # Timestamped backup of outgoing live file on each activate(), for manual rollback.
      # No UI yet at POC stage.
      archive-dir: ${EARS_ONTOLOGY_RDF_ARCHIVE_DIR:/var/ears/ontology/archive}
  read-only: false
  program:
    regex: "202[6-9]"