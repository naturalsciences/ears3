spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6543/ears3
    username: ears
    password: ears
    test-on-borrow: true
    validationQuery: SELECT 1

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
      naming:
        strategy: org.hibernate.cfg.EJB3NamingStrategy
    defer-datasource-initialization: true

  mvc:
    static-path-pattern: /resources/**

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

logging:
  level:
    org:
      springframework:
        web: DEBUG

java:
  util:
    logging:
      SimpleFormatter:
        format: "%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS %4$-6s %2$s %5$s%6$s%n"

server:
  port: 8081
  servlet:
    context-path: /ears3


ears:
  platform: SDN:C17::11BU
  send-events-to: http://replace.me
  navigation:
    server: http://replace.me
  csr:
    license: UN
  ontology:
    username: earsontology
    password: REPLACEME
    mode: ${EARS_ONTOLOGY_MODE:PASSIVE}
    # Gates tree edits + "generate from DB". Master only. Safe default: false.
    editing-enabled: ${EARS_ONTOLOGY_EDITING_ENABLED:false}
    # Gates staging + activating RDF. Safe to leave true everywhere.
    import-enabled: ${EARS_ONTOLOGY_IMPORT_ENABLED:true}
    rdf:
      # Active RDF file - point SPARQL engine here.
      live-path: ${EARS_ONTOLOGY_RDF_LIVE_PATH:/var/ears/ontology/live.rdf}
      # Staging slot, filled by /stage or /generate, consumed by /activate.
      staged-path: ${EARS_ONTOLOGY_RDF_STAGED_PATH:/var/ears/ontology/staged.rdf}
      # Timestamped backup of outgoing live file on each activate(), for
      # manual rollback. No UI yet at POC stage.
      archive-dir: ${EARS_ONTOLOGY_RDF_ARCHIVE_DIR:/var/ears/ontology/archive}
      # POC opt-in, ACTIVE mode only: also repopulate ontology_* tables on
      # activate() so the tree UI has data on master. No-op on PASSIVE.
      populate-db-on-activate: ${EARS_ONTOLOGY_POPULATE_DB_ON_ACTIVATE:false}
  read-only: false
  program:
    regex: "202[6-9]"